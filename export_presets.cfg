[preset.0]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="plan.md,tests/*,tools/*,build/*,README.md"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=".tools/templates/web_nothreads_debug.zip"
custom_template/release=".tools/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include="<meta name=\"description\" content=\"Candy Grove: pick a candy, take its branch. A strategy game built with Godot.\"><meta name=\"theme-color\" content=\"#f8f5ef\"><style>body{background:#f8f5ef!important}#canvas{outline:none}#status{background:#f8f5ef!important;color:#393346!important}#status::before{content:\"Candy Grove\";font:600 40px/1.1 system-ui,sans-serif}#status::after{content:\"Growing a new grove...\";margin-top:12px;font:400 16px/1.4 system-ui,sans-serif;color:#89818c}#status-progress{height:4px;accent-color:#7960aa}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
